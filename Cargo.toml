[workspace]
resolver = "2"
members = [
    "tidewave-core",
    "tidewave-cli",
    "src-tauri",
]

[workspace.package]
version = "1.1.0"

[profile.dev]
# Full debuginfo makes target/debug grow to tens of GBs across rebuilds.
# Keep line tables so panics/backtraces still have file:line.
debug = "line-tables-only"

[patch.crates-io]
# TODO: https://github.com/tauri-apps/tao/pull/1369
tao = { git = "https://github.com/wojtekmach/tao.git", branch = "wm-bundled-activation-policy" }
